<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery - Просмотр модели</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="detail-view active" id="detailView">
        <div class="detail-header">
            <h2 class="detail-title" id="modelTitle">Модель</h2>
            <button class="close-btn" id="closeBtn">Закрыть</button>
        </div>
        <div class="detail-canvas-container">
            <canvas id="detailCanvas" class="detail-canvas"></canvas>
        </div>
        <div class="detail-controls">
            <div class="control-group">
                <button class="zoom-btn" id="zoomIn">+</button>
                <label>Зум</label>
                <button class="zoom-btn" id="zoomOut">−</button>
            </div>
            <div class="control-group">
                <button class="view-btn" id="viewFront">Вид спереди</button>
                <button class="view-btn" id="viewBack">Вид сзади</button>
                <button class="view-btn" id="viewLeft">Вид слева</button>
                <button class="view-btn" id="viewRight">Вид справа</button>
            </div>
        </div>
    </div>
    <script type="module" src="detail.js"></script>
</body>
</html>
