<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задачи 1.7, 2.7, 3.7</title>
</head>
<body>
    <h3>Задачи по JavaScript</h3>

    <button id="task1Btn">Задание 1.7 - isEqualObj</button>
    <button id="task2Btn">Задание 2.7 - sumDiagonals</button>
    <button id="task3Btn">Задание 3.7 - plainify</button>

    <h4>Результат:</h4>
    <pre id="output"></pre>

    <script>
        // Задание 1.7 (1 уровень)
        function isEqualObj(obj1, obj2) {
            return JSON.stringify(obj1) === JSON.stringify(obj2);
        }

        // Задание 2.7 (2 уровень)
        function sumDiagonals(matrix) {
            const n = matrix.length;
            if (n === 0) return 0;

            let mainSum = 0;
            let secondarySum = 0;

            for (let i = 0; i < n; i++) {
                mainSum += matrix[i][i];
                secondarySum += matrix[i][n - 1 - i];
            }

            if (n % 2 === 1) {
                const center = matrix[Math.floor(n / 2)][Math.floor(n / 2)];
                return mainSum + secondarySum - center;
            }

            return mainSum + secondarySum;
        }

        // Задание 3.7 (3 уровень)
        function plainify(obj, parentKey = '', result = {}) {
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    const newKey = parentKey ? `${parentKey}.${key}` : key;
                    const value = obj[key];

                    if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
                        plainify(value, newKey, result);
                    } else {
                        result[newKey] = value;
                    }
                }
            }
            return result;
        }

        // Кнопки и вывод
        const output = document.getElementById('output');

        document.getElementById('task1Btn').onclick = () => {
            const objA = { a: 1, b: 2, c: { d: 3 } };
            const objB = { a: 1, b: 2, c: { d: 3 } };
            const result = isEqualObj(objA, objB);
            output.textContent = `isEqualObj({ a: 1, b: 2, c: { d: 3 } }, { a: 1, b: 2, c: { d: 3 } }) = ${result}`;
        };

        document.getElementById('task2Btn').onclick = () => {
            const matrix = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
            const result = sumDiagonals(matrix);
            output.textContent = `sumDiagonals([[1,2,3], [4,5,6], [7,8,9]]) = ${result}`;
        };

        document.getElementById('task3Btn').onclick = () => {
            const nestedObj = { a: 1, b: { c: 2, d: { e: 3, f: [4, 5] } }, g: null, h: 'hello' };
            const result = plainify(nestedObj);
            output.textContent = `plainify(вложенный объект) = \n${JSON.stringify(result, null, 2)}`;
        };
    </script>
</body>
</html>
